<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bureau des agents</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%23c98a1e'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%236a61d0'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%2313866a'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23c4512a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow" id="hote">Agents de codage · ce poste</div>
    <h1>Le bureau des agents</h1>
    <div class="counts" id="counts"></div>
    <div class="toolbar">
      <div class="seg" role="radiogroup" aria-label="Période des indicateurs" id="fenetre">
        <button type="button" role="radio" data-f="1h">1 h</button><button type="button" role="radio" data-f="24h">24 h</button><button type="button" role="radio" data-f="7j">7 j</button>
      </div>
      <label class="chk"><input type="checkbox" id="fermees"> Sessions fermées</label>
      <input type="search" id="cherche" placeholder="Chercher un agent…" aria-label="Chercher un agent">
      <span id="msg" aria-live="polite"></span>
      <button type="button" id="actualiser" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Actualiser</button>
    </div>
    <div class="bandeau" id="bandeau" hidden></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Vues">
    <button type="button" role="tab" data-v="plan" aria-selected="true">Plan</button>
    <button type="button" role="tab" data-v="rendement" aria-selected="false">Rendement</button>
    <button type="button" role="tab" data-v="poste" aria-selected="false">Poste</button>
    <button type="button" role="tab" data-v="organisation" aria-selected="false">Organisation</button>
  </nav>

  <section class="vue" id="v-plan" role="tabpanel">
    <div class="plan-zone">
      <div>
        <p class="aide">Glisse une personne ou une session vers un autre bureau. Sur téléphone, ouvre sa fiche et choisis « Bureau ».</p>
        <div class="plan" id="plan"></div>
      </div>
      <aside class="fiche" id="fiche" aria-live="polite"></aside>
    </div>
  </section>

  <section class="vue" id="v-rendement" role="tabpanel" hidden></section>
  <section class="vue" id="v-poste" role="tabpanel" hidden></section>
  <section class="vue" id="v-organisation" role="tabpanel" hidden></section>
</div>
<script src="app.js"></script>
</body>
</html>
